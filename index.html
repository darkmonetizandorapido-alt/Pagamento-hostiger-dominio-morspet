<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pagamento do domínio Hostinger</title>
<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--accent:#673de6;--accent-t:#fff;--ok:#12a150;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111114;--card:#1c1c21;--text:#f5f5f7;--muted:#9a9aa3;--accent:#8b6cf0;--ok:#3ddc84}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111114;--card:#1c1c21;--text:#f5f5f7;--muted:#9a9aa3;--accent:#8b6cf0;--ok:#3ddc84}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
main{background:var(--card);border-radius:20px;padding:36px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.08)}
h1{font-size:1.5rem;margin:0 0 8px}
.valor{font-size:2rem;font-weight:700;margin:0 0 24px}
button{width:100%;border:0;border-radius:12px;padding:16px;font-size:1.05rem;font-weight:600;background:var(--accent);color:var(--accent-t);cursor:pointer;transition:transform .1s,background .2s}
button:active{transform:scale(.98)}
button.ok{background:var(--ok)}
p.dica{color:var(--muted);font-size:.9rem;margin:16px 0 0}
</style>
</head>
<body>
<main>
  <h1>Pagamento do domínio Hostinger</h1>
  <p class="valor">R$ 39,90</p>
  <button id="btn" type="button">Copiar chave Pix copia e cola</button>
  <p class="dica" id="dica" aria-live="polite">Cole no app do seu banco, em Pix › Copia e cola.</p>
</main>
<script>
const PIX = "00020101021226870014br.gov.bcb.pix2565qrcode.dlocal.com/qr/25021356/v1/0615ca4aa9404995a32b913360c620925204000053039865802BR5906DLOCAL6009SAO PAULO62070503***63042D6F";
const btn = document.getElementById("btn");
const dica = document.getElementById("dica");

function fallback(text){
  const t = document.createElement("textarea");
  t.value = text;
  t.style.position = "fixed";
  t.style.opacity = "0";
  document.body.appendChild(t);
  t.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch(e) {}
  document.body.removeChild(t);
  return ok;
}

btn.addEventListener("click", async () => {
  let ok = false;
  try {
    await navigator.clipboard.writeText(PIX);
    ok = true;
  } catch(e) {
    ok = fallback(PIX);
  }
  if (ok) {
    btn.textContent = "Chave copiada!";
    btn.classList.add("ok");
    dica.textContent = "Agora é só colar no app do seu banco.";
    setTimeout(() => {
      btn.textContent = "Copiar chave Pix copia e cola";
      btn.classList.remove("ok");
    }, 2500);
  } else {
    dica.textContent = "Não foi possível copiar. Tente novamente.";
  }
});
</script>
</body>
</html>
